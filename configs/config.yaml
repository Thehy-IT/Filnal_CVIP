detection:
  train_csv: "data/processed/train_bboxes.csv"
  val_csv: "data/processed/val_bboxes.csv"
  img_dir: "data/processed/train/images"
  val_img_dir: "data/processed/val/images"
  batch_size: 4
  epochs: 50
  lr: 0.0001
  weight_save_path: "experiments/weights/faster_rcnn_best.pth"
  image_size: 512
  amp: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  validate_every: 2
  weight_decay: 0.0001
  compile: false

segmentation:
  train_img_dir: "data/processed/train/images"
  train_mask_dir: "data/processed/train/masks"
  val_img_dir: "data/processed/val/images"
  val_mask_dir: "data/processed/val/masks"
  batch_size: 4
  epochs: 50
  lr: 0.0005
  weight_save_path: "experiments/weights/unet_best.pth"
  image_size: 512
  amp: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  validate_every: 2
  weight_decay: 0.0
  compile: false
